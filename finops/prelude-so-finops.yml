principles:
- name: Visibility
  description: Track verifications and messages by destination country and channel; message cost is pass-through and country-driven.
- name: Allocation
  description: Use correlation_id / metadata and per-product API keys to map verification, lookup, and watch spend to teams or products.
- name: Optimization
  description: Let Prelude's smart routing pick the cheapest working channel; use Watch and Lookup to suppress fraudulent or invalid numbers before paying to message them; prefer cheaper channels where deliverability allows.
- name: Accountability
  description: Review monthly usage against tier features; on Enterprise, negotiate committed-volume discounts and monitor against the 99.95% SLA.
