description: >-
  FinOps view of Prelude spend. Prelude is a hosted, usage-based service. The two
  dominant cost drivers are (1) a per-verification fee (from EUR 0.032 on
  Pay-As-You-Go) and (2) carrier message costs, which Prelude bills "at cost,
  zero markup" and which vary by destination country and channel (SMS, WhatsApp,
  RCS, Viber, voice). The Startup tier adds a fixed EUR 360 / month platform
  subscription on top of usage. Enterprise is committed-volume with automatic
  discounts, post-payment terms, and a 99.95% SLA. Lookup (Intel) and Watch
  (anti-fraud) calls may be metered separately. Because message cost is
  pass-through and country-specific, geographic mix of your users is the single
  biggest lever on total spend.
notes: >-
  Per-unit rates reflect prelude.so/pricing as of 2026-07-11 (EUR). Carrier
  message rates change by country/channel; treat them as pass-through variable
  cost. Confirm Lookup and Watch metering with Prelude.
