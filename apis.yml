aid: prelude-so
url: https://raw.githubusercontent.com/api-evangelist/prelude-so/refs/heads/main/apis.yml
name: Prelude
kind: company
description: >-
  Prelude is a phone and email verification API - "the trust layer between your
  signups and your business." Its Verify API creates and checks one-time
  passcodes (OTP) across SMS, WhatsApp, RCS, Viber, and voice in 230+ countries,
  with smart multi-provider routing and built-in anti-fraud. Alongside Verify,
  Prelude offers Notify (transactional messaging), Lookup / Intel (phone number
  intelligence - line type, carrier, ported and temporary flags, CNAM), and
  Watch (anti-fraud risk prediction and feedback). The public REST API v2 lives
  at https://api.prelude.dev/v2 with Bearer API-key auth and official SDKs for
  Python, Node.js, Java, and Go. Prelude positions itself as a developer-first
  alternative to Twilio Verify.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Number Verification
- Phone Verification
- OTP
- Authentication
- Anti-Fraud
- Two-Factor Authentication
- SMS
- Phone Number Lookup
